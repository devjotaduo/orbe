repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-ast
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/|^\.claude/)'
      - id: sort-simple-yaml
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/|^\.claude/)'
      - id: check-yaml
        exclude: |
          (?x)^(
              meta.yaml
          )$
      - id: check-xml
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/|^\.claude/)'
      - id: check-toml
      - id: check-docstring-first
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/|^\.claude/)'
      - id: check-json
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/|^\.claude/)'
      - id: fix-encoding-pragma
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/|^\.claude/)'
      - id: detect-private-key
      - id: trailing-whitespace
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/|^\.claude/|^aionui-clone/|^reports/)'
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v3.1.0
    hooks:
      - id: add-trailing-comma
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/|^\.claude/)'
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.0
    hooks:
      - id: mypy
        exclude:
          (?x)(
          pb2\.py$
          | grpc\.py$
          | ^docs
          | \.html$
          | .*/skills/.*
          | ^e2e/
          | ^\.claude/
          | ^plugins/bundle/
          | ^plugins/tool/
          )
        args: [
          --ignore-missing-imports,
          --disable-error-code=var-annotated,
          --disable-error-code=union-attr,
          --disable-error-code=assignment,
          --disable-error-code=attr-defined,
          --disable-error-code=import-untyped,
          --disable-error-code=truthy-function,
          --follow-imports=skip,
          --explicit-package-bases,
        ]
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        args: [ --line-length=79 ]
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/|^\.claude/)'
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: [ "--extend-ignore=E203"]
        exclude: '(?x)(.*/skills/.*|^scripts/pack/|^e2e/|^\.claude/)'
  - repo: https://github.com/pylint-dev/pylint
    rev: v3.0.2
    hooks:
      - id: pylint
        exclude:
          (?x)(
          ^docs
          | pb2\.py$
          | grpc\.py$
          | \.demo$
          | \.md$
          | \.html$
          | .*/skills/.*
          | ^e2e/
          | ^\.claude/
          )
        args: [
          --disable=W0511,
          --disable=W0718,
          --disable=W0122,
          --disable=C0103,
          --disable=R0913,
          --disable=E0401,
          --disable=E1101,
          --disable=C0415,
          --disable=W0603,
          --disable=R1705,
          --disable=R0914,
          --disable=E0601,
          --disable=W0602,
          --disable=W0604,
          --disable=R0801,
          --disable=R0902,
          --disable=R0903,
          --disable=C0123,
          --disable=W0231,
          --disable=W1113,
          --disable=W0221,
          --disable=R0401,
          --disable=W0632,
          --disable=W0123,
          --disable=C3001,
          --disable=W0201,
          --disable=C0302,
          --disable=W1203,
          --disable=C2801,
          --disable=C0114,  # Disable missing module docstring for quick dev
          --disable=C0115,  # Disable missing class docstring for quick dev
          --disable=C0116,  # Disable missing function or method docstring for quick dev
          --disable=C0301,  # line-too-long — covered by flake8 E501
          --disable=C0327,  # mixed-line-endings — CRLF/LF editor artifact
          --disable=E0611,  # no-name-in-module — false positive on dynamic imports
          --disable=W0621,  # redefined-outer-name — common local-import pattern
          --disable=W0404,  # reimported — common with conditional imports
          --disable=W0613,  # unused-argument — common in pytest fixtures and callbacks
          --disable=W0212,  # protected-access — common in test code and framework wrappers
          --disable=W0707,  # raise-missing-from — style preference
          --disable=R0912,  # too-many-branches — complex state machines
          --disable=R0915,  # too-many-statements — complex functions
          --disable=C1803,  # use-implicit-booleaness-not-comparison
          --disable=E1120,  # no-value-for-parameter — false positive with Click
          --disable=W1510,  # subprocess-run-check — handled explicitly where needed
          --disable=W0612,  # unused-variable — common in unpack patterns
          --disable=E1135,  # unsupported-membership-test — false positive with mocks
          --disable=E1136,  # unsubscriptable-object — false positive with mocks
        ]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: 'v3.0.0'
    hooks:
      - id: prettier
        additional_dependencies: [ 'prettier@3.0.0' ]
        files: \.(tsx?)$
        exclude: '(?x)(^web/|^console/|/dist/|.*/skills/.*|^scripts/pack/|^aionui-clone/)'