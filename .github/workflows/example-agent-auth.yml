# Example: how an automated agent authenticates with a short-lived GitHub App
# installation token instead of a personal access token.
#
# Setup: create a GitHub App with Contents: RW + Pull requests: RW, install it
# on this repo, and store its credentials as the repo secrets APP_ID and
# APP_PRIVATE_KEY. See docs/agent-auth.md.
#
# Manual-dispatch only so it never runs on normal pushes.
name: example-agent-auth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a short-lived installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Use the token (checkout as the app)
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      # From here, git push / gh / the REST API authenticate as the app, e.g.:
      #   git push https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git HEAD:my-branch
      #   gh pr create --base main --head my-branch --title "..." --body "..."
      - name: Confirm identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api /repos/${{ github.repository }} --jq '.full_name'
