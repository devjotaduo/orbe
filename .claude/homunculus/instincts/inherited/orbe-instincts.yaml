# Orbe Workflow Ui Theme Refactor And Homepage

## Action

Follow the ui-theme-refactor-and-homepage workflow:
1. Add or update CSS/LESS tokens (console/src/styles/aionui-tokens.less, aionui-tokens.css, layout.css)
2. Refactor layout and component styles to use tokens instead of hardcoded colors (index.module.less, layout.css, etc.)
3. Add or update Home page files (console/src/pages/Home/index.tsx, index.module.less)
4. Register Home route (console/src/layouts/registry/builtinRoutes.tsx)
5. Add or update i18n keys in all locale files (console/src/locales/*.json)
6. Add or update tests for Home page or layout (index.test.tsx, layout.darkmode.test.tsx, Sidebar.test.tsx)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~4x per month
- Files: console/src/styles/aionui-tokens.less, console/src/styles/aionui-tokens.css, console/src/styles/layout.css

